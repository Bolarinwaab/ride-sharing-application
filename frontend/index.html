<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RideNow</title><style>body{font-family:Inter,Arial,sans-serif;margin:0;background:#f5f7fb;color:#14213d}main{max-width:980px;margin:auto;padding:64px 24px}h1{font-size:48px;margin:0 0 12px}p{font-size:18px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:white;border-radius:16px;padding:22px;box-shadow:0 8px 30px #00000012}button{padding:12px 18px;border:0;border-radius:10px;font-weight:700;cursor:pointer}</style></head><body><main><h1>RideNow</h1><p>Reliable rides, transparent fares and real-time trip visibility.</p><div class="grid"><div class="card"><h3>Request a ride</h3><p>Choose pickup and destination.</p><button onclick="alert('Demo ride request created')">Request demo ride</button></div><div class="card"><h3>Driver mode</h3><p>Manage availability and accept nearby trips.</p></div><div class="card"><h3>Trip tracking</h3><p>Monitor driver location and ETA.</p></div></div></main></body></html>
